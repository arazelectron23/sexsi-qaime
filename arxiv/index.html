<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024, initial-scale=0.4, maximum-scale=1.0, user-scalable=no">
    <title>Arxiv - Qaimə</title>
    <link rel="stylesheet" href="../style.css?v=2.01">
    <link rel="stylesheet" href="./arxiv.css?v=2.01">
    <link rel="manifest" href="../manifest.json?v=2.01">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="shortcut icon" type="image/png" href="../favicon.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
</head>
<body>
    <!-- Modal Pəncərə -->
    <div id="archive-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box;">
        <div style="background: #1e293b; border: 1px solid #334155; width: 100%; max-width: 450px; border-radius: 10px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); color: #fff; position: relative;">
            <h3 style="margin-top: 0; font-size: 16px; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 10px;">📦 Qaimə Detalları</h3>
            <div id="archive-modal-content" style="margin: 15px 0; font-size: 13px; max-height: 60vh; overflow-y: auto;">
                <!-- Dinamiq məzmun buraya gələcək -->
            </div>
            <button id="close-archive-modal" style="width: 100%; background: #3b82f6; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;">Bağla</button>
        </div>
    </div>

    <div class="app-container">
        <!-- Header / Naviqasiya -->
        <header class="app-header">
            <div class="header-title-area">
                <h1>📦 Qaimə Arxiv</h1>
                <p>Arxivləşdirilmiş qaimələr və hesabat</p>
            </div>
            <div class="header-actions">
                <a href="../setting/index.html" class="btn-icon" id="btn-back-home">← Parametr</a>
            </div>
        </header>

        <!-- Axtarış və Tarix Filtrləri Bölməsi -->
        <section class="filter-section">
            <div class="search-row">
                <input type="text" id="archive-search-input" placeholder="Müştəri axtar..." class="form-control">
            </div>
            <div class="filter-row">
                <div class="date-inputs-group">
                    <span class="date-label">Başlanğıc:</span>
                    <input type="text" id="start-date" class="form-control" style="background: #0f172a; color: #fff; border: 1px solid #334155; padding: 5px 8px; border-radius: 6px; font-size: 12px; width: 110px; cursor: pointer;">
                    
                    <span class="date-label">Bitiş:</span>
                    <input type="text" id="end-date" class="form-control" style="background: #0f172a; color: #fff; border: 1px solid #334155; padding: 5px 8px; border-radius: 6px; font-size: 12px; width: 110px; cursor: pointer;">
                </div>
                <!-- Filtrlə və Cəmi hissəsi -->
                
<div class="filter-action-group" style="flex-wrap: wrap; gap: 8px;">
    <div id="total-amount-box">
        Cəmi: <span id="total-sum">0.00</span> AZN
    </div>
    <!-- Yeni əlavə olunan xanalar -->
    <div id="total-yol-box" style="background: #0f172a; padding: 6px 12px; border-radius: 6px; border: 1px solid #334155; font-size: 12px; color: #facc15; font-weight: bold;">
        Yol: <span id="total-yol-sum">0.00</span> AZN
    </div>
    <div id="total-xidmet-box" style="background: #0f172a; padding: 6px 12px; border-radius: 6px; border: 1px solid #334155; font-size: 12px; color: #a78bfa; font-weight: bold;">
        Xidmət: <span id="total-xidmet-sum">0.00</span> AZN
    </div>
    <button id="btn-filter" class="btn-filter-action">🔍 Filtrlə</button>
</div>
            </div>
        </section>

        <!-- Arxiv Siyahısı Konteyneri -->
        <main class="main-content">
            <div id="archive-list-container" class="waiting-list-container">
                <!-- Arxiv siyahısı buraya dinamik yüklənəcək -->
            </div>
        </main>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script type="module" src="./arxiv.js?v=11.02"></script>
</body>
</html>
